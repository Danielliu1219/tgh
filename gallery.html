<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画廊 · AI“涂鸦画廊”</title>
<meta name="description" content="涂鸦墙画廊：作品按作品集陈列，按题材筛选、搜索、排序。点开一集看全部作品，再点任意一幅进书本翻页。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='4' fill='%23171327'/%3E%3Ccircle cx='32' cy='33' r='15' fill='%23E82E4F'/%3E%3Ccircle cx='17' cy='16' r='3.5' fill='%239A7FBC'/%3E%3Ccircle cx='48' cy='13' r='2.5' fill='%23F3D1CA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/common.css">
<style>
.gallery-head { padding: 118px 0 6px; max-width: 720px; }
.gallery-head h1 { font-size: clamp(36px, 5.6vw, 62px); color: var(--cream); line-height: 1.2; }
.gallery-head h1 .amber { color: var(--amber); }
#countLine { color: var(--cream-dim); margin-top: 12px; font-size: 14px; }

.gallery-tools {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 30px 0 18px;
}
.search {
  display: flex; align-items: stretch; flex: 1; min-width: 240px;
}
.search input {
  flex: 1; padding: 11px 16px;
  background: rgba(33, 25, 79, .55);
  border: 1px solid var(--line); border-right: 0; border-radius: var(--r-input) 0 0 var(--r-input);
  color: var(--cream); font-size: 14.5px;
}
.search input:focus { border-color: var(--amber); outline: none; }
.search button {
  padding: 0 20px; background: var(--amber); color: #F3D1CA;
  border: 0; border-radius: 0 var(--r-input) var(--r-input) 0; font-weight: 700;
}
.gallery-tools select {
  padding: 11px 14px;
  background: rgba(33, 25, 79, .55);
  border: 1px solid var(--line); border-radius: var(--r-input);
  color: var(--cream); font-size: 14px;
}
.gallery-tools select option { background: var(--ink-2); }

/* 分类筛选：一排小胶囊 */
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
.chip {
  padding: 8px 18px; border-radius: 4px;
  background: transparent; border: 1px solid var(--line-strong);
  color: var(--cream-dim); font-size: 14px; white-space: nowrap;
  transition: all .2s;
}
.chip:hover { border-color: var(--amber); color: var(--cream); }
.chip.active { background: var(--amber); border-color: var(--amber); color: #F3D1CA; font-weight: 700; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
.grid.sets { grid-template-columns: repeat(3, 1fr); gap: 26px; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } .grid.sets { grid-template-columns: repeat(2, 1fr); } }

/* 作品集卡：封面大图 + 名字 + 分类/幅数/赞 */
.set-card {
  position: relative; display: block; overflow: hidden;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-card);
  transform-style: preserve-3d; will-change: transform;
  transition: border-color .25s, box-shadow .25s;
}
.set-card:hover { border-color: rgba(232, 46, 79, .5); box-shadow: var(--shadow-soft), var(--glow-amber); }
.set-card .pic { aspect-ratio: 4/4.4; overflow: hidden; position: relative; }
.set-card .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.16,1,.3,1); }
.set-card:hover .pic img { transform: scale(1.06); }
.set-card .pic .shade {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(23, 19, 39, .18), transparent 30%, transparent 62%, rgba(23, 19, 39, .78));
}
.set-card .set-cat { position: absolute; top: 12px; left: 12px; z-index: 2;
  background: rgba(23, 19, 39, .84); border-color: rgba(243, 209, 202, .55); color: #F3D1CA; }
.set-card .set-count {
  position: absolute; right: 14px; bottom: 12px; z-index: 2;
  font-family: var(--font-en); font-size: 14px; letter-spacing: .14em; color: var(--cream);
}
.set-card .info { padding: 13px 17px 16px; }
.set-card .info .t { font-family: var(--font-display); font-weight: 800; font-size: 21px; color: var(--cream); line-height: 1.35; }
.set-card .info .meta { display: flex; gap: 9px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--cream-dim); }
.set-card .info .meta .likes { margin-left: auto; color: var(--amber-hot); }

.art-card {
  position: relative; display: block; overflow: hidden;
  background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-card);
  transform-style: preserve-3d; will-change: transform;
  transition: border-color .25s, box-shadow .25s;
}
.art-card:hover { border-color: rgba(232, 46, 79, .5); box-shadow: var(--shadow-soft), var(--glow-amber); }
.art-card .pic { aspect-ratio: 4/4.6; overflow: hidden; position: relative; }
.art-card .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.16,1,.3,1); }
.art-card:hover .pic img { transform: scale(1.07); }
.art-card .layer-badge { position: absolute; top: 12px; right: 12px; z-index: 2; }
.art-card .info { padding: 12px 16px 15px; }
.art-card .info .t { font-family: var(--font-display); font-weight: 800; font-size: 18.5px; color: var(--cream); }
.art-card .info .meta { display: flex; gap: 9px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--cream-dim); }
.art-card .info .meta .likes { margin-left: auto; color: var(--amber-hot); }
</style>
</head>
<body>

<a class="skip" href="#main">跳到正文</a>

<header id="site-nav" data-active="gallery"></header>

<main class="wrap" id="main">
  <div class="gallery-head">
    <h1>涂鸦墙 <span class="amber">画廊</span></h1>
    <p id="countLine"></p>
  </div>

  <div class="gallery-tools">
    <div class="search">
      <input id="qInput" placeholder="搜作品集 / 标题 / 作者" aria-label="搜索">
      <button onclick="applyFilters()">搜索</button>
    </div>
    <select id="sortSel" aria-label="排序方式" onchange="applyFilters()">
      <option value="new">最新发布</option>
      <option value="hot">最热（点赞）</option>
    </select>
    <a class="btn small" href="upload.html" style="margin-left:auto">发布作品</a>
  </div>

  <div class="chip-row" id="chipRow"></div>

  <div class="grid sets" id="grid"></div>
</main>

<footer id="site-footer"></footer>

<script src="assets/lib/gsap/gsap.min.js"></script>
<script src="assets/lib/gsap/ScrollTrigger.min.js"></script>
<script src="assets/lib/gsap/Flip.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
